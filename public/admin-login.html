<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingreso administración | MDRN & CO.</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="pagina-login">
  <main class="login-caja">
    <img src="img/logo.png" alt="MDRN & CO." class="login-logo" width="200" height="57">
    <h1>Panel de administración</h1>
    <p class="login-sub">Ingresá con tu usuario y contraseña</p>

    <form id="formLogin" novalidate>
      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" name="usuario" autocomplete="username" maxlength="50" required autofocus>

      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" autocomplete="current-password" maxlength="100" required>

      <div id="errorLogin" class="aviso-error" role="alert"></div>
      <button type="submit" class="btn-principal" id="btnLogin">Ingresar</button>
    </form>

    <a href="index.html" class="volver">&larr; Volver al sitio</a>
  </main>
  <script src="js/admin-login.js"></script>
</body>
</html>
